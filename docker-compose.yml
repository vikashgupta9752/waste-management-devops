# =============================================================================
# Docker Compose — Laravel Waste Management System
# =============================================================================
#
# This file orchestrates all the services needed to run the complete
# DevOps-integrated waste management system locally.
#
# SERVICES:
#   1. app        — Laravel PHP-FPM application
#   2. nginx      — Web server / reverse proxy
#   3. redis      — Cache and session storage
#   4. prometheus  — Metrics collection
#   5. grafana     — Monitoring dashboards
#   6. loki        — Log aggregation
#   7. promtail    — Log shipping agent
#
# QUICK START:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f app    # View Laravel logs
#
# ACCESS POINTS:
#   Application:  http://localhost:8080
#   Grafana:      http://localhost:3000  (admin/admin)
#   Prometheus:   http://localhost:9090
#
# =============================================================================

services:

  # ============================================
  # 1. Laravel Application (PHP-FPM)
  # ============================================
  # The main Laravel app running as PHP-FPM.
  # Source code is mounted as a volume for live changes.
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: waste-mgmt-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Mount source code for live reloading
      - .:/var/www/html
      # Persist vendor directory inside container (faster)
      - vendor-data:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    env_file:
      - .env.docker
    networks:
      - waste-mgmt-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # 2. Nginx Reverse Proxy
  # ============================================
  # Serves the Laravel application to the browser.
  # Routes requests to PHP-FPM (app service).
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: waste-mgmt-nginx
    restart: unless-stopped
    ports:
      - "8080:80"                          # Access app at http://localhost:8080
    volumes:
      # Mount the app's public directory
      - .:/var/www/html:ro
      # Use the Docker-specific Nginx config
      - ./docker/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx logs for Promtail to collect
      - nginx-logs:/var/log/nginx
    networks:
      - waste-mgmt-network
    depends_on:
      - app

  # ============================================
  # 3. Redis (Cache & Sessions)
  # ============================================
  # In-memory data store used for:
  # - Caching Laravel queries and responses
  # - Storing user sessions
  # - Queue management
  # ============================================
  redis:
    image: redis:alpine
    container_name: waste-mgmt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - waste-mgmt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # 4. Prometheus (Metrics Collection)
  # ============================================
  # Collects performance metrics from all services.
  # Grafana reads from Prometheus to display dashboards.
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: waste-mgmt-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"                        # Access at http://localhost:9090
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'  # Keep 15 days of metrics
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - waste-mgmt-network

  # ============================================
  # 5. Grafana (Monitoring Dashboards)
  # ============================================
  # Visual dashboards showing:
  # - Application health and uptime
  # - Request rates and response times
  # - System resource usage
  # - Centralized log viewer (via Loki)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: waste-mgmt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"                        # Access at http://localhost:3000
    environment:
      # Default login credentials (change in production!)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Auto-provision data sources (Prometheus + Loki)
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Auto-provision dashboards
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Persist Grafana data
      - grafana-data:/var/lib/grafana
    networks:
      - waste-mgmt-network
    depends_on:
      - prometheus
      - loki

  # ============================================
  # 6. Loki (Log Aggregation)
  # ============================================
  # Collects and indexes logs from all services.
  # Think of it as "Prometheus, but for logs."
  # Grafana queries Loki to display log streams.
  # ============================================
  loki:
    image: grafana/loki:2.9.0
    container_name: waste-mgmt-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - waste-mgmt-network

  # ============================================
  # 7. Promtail (Log Shipping Agent)
  # ============================================
  # Reads log files and sends them to Loki.
  # Monitors:
  # - Laravel application logs
  # - Nginx access/error logs
  # ============================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: waste-mgmt-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Mount Laravel logs so Promtail can read them
      - ./storage/logs:/var/log/laravel:ro
      # Mount Nginx logs
      - nginx-logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - waste-mgmt-network
    depends_on:
      - loki

# ============================================
# NETWORKS
# ============================================
# All services communicate over this internal network.
# Services can reach each other by container name.
# Example: app connects to redis at "redis:6379"
# ============================================
networks:
  waste-mgmt-network:
    driver: bridge
    name: waste-mgmt-network

# ============================================
# VOLUMES
# ============================================
# Named volumes persist data between container restarts.
# Even if you stop/remove containers, data is preserved.
# To fully reset: docker-compose down -v
# ============================================
volumes:
  vendor-data:
    name: waste-mgmt-vendor
  redis-data:
    name: waste-mgmt-redis
  prometheus-data:
    name: waste-mgmt-prometheus
  grafana-data:
    name: waste-mgmt-grafana
  loki-data:
    name: waste-mgmt-loki
  nginx-logs:
    name: waste-mgmt-nginx-logs
  backup-data:
    name: waste-mgmt-backups
