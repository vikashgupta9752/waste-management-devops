# =============================================================================
# Nginx Configuration for Docker Compose
# =============================================================================
# This is the Docker Compose version of the Nginx config.
# The production config (docker/nginx.conf) is NOT modified.
#
# KEY FEATURES:
# - Reverse proxy to PHP-FPM (app:9000)
# - Gzip compression for faster page loads
# - Security headers (XSS, clickjacking, MIME-sniff protection)
# - Static file caching (CSS, JS, images)
# - Rate limiting to prevent abuse
# - Access/error logs for Promtail collection
# =============================================================================

# Rate limiting zone — prevents request flooding
# Allows 10 requests/second per IP address
limit_req_zone $binary_remote_addr zone=app_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # Laravel's public directory is the web root
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------
    # These headers protect against common web attacks
    add_header X-Frame-Options "SAMEORIGIN" always;           # Prevents clickjacking
    add_header X-Content-Type-Options "nosniff" always;       # Prevents MIME-type sniffing
    add_header X-XSS-Protection "1; mode=block" always;       # XSS filter
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS

    # ------------------------------------------
    # GZIP COMPRESSION
    # ------------------------------------------
    # Compresses responses to reduce bandwidth usage
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------
    # REQUEST SIZE LIMITS
    # ------------------------------------------
    client_max_body_size 10M;    # Max upload size
    client_body_timeout 60s;     # Time to receive request body

    # ------------------------------------------
    # LOGGING
    # ------------------------------------------
    # Logs are collected by Promtail → sent to Loki → viewable in Grafana
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ------------------------------------------
    # STATIC FILE CACHING
    # ------------------------------------------
    # Vite build assets (CSS, JS bundles)
    location /build {
        alias /var/www/html/public/build;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # All static files (images, fonts, etc.)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------
    # LARAVEL ROUTES
    # ------------------------------------------
    # Send all non-file requests to Laravel's front controller
    location / {
        limit_req zone=app_limit burst=20 nodelay;   # Apply rate limiting
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Suppress favicon and robots.txt errors
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel handles 404 errors
    error_page 404 /index.php;

    # ------------------------------------------
    # PHP-FPM PROXY
    # ------------------------------------------
    # Forwards PHP requests to the 'app' container on port 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;                                   # Docker service name
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;                        # Hide PHP version

        # FastCGI tuning
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ------------------------------------------
    # SECURITY: Block hidden files
    # ------------------------------------------
    # Deny access to .env, .git, .htaccess, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ------------------------------------------
    # Nginx Status (for monitoring)
    # ------------------------------------------
    # Used by Prometheus to collect Nginx metrics
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.0.0.0/8;     # Docker internal network
        allow 127.0.0.1;       # Localhost
        deny all;              # Block external access
    }
}

